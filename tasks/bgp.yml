
- name: package bird
  apt:
    name: bird
  become: true
  tags: ['nlb']

- name: bird configuration
  template:
    src: bird.conf.j2
    dest: /etc/bird/bird.conf
  become: true
  tags: ['nlb']

- name: restart bird
  service:
    name: bird
    enabled: yes
    state: restarted
  become: true
  tags: ['nlb']
